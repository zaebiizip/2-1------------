<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 수행평가 일정</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">
    <div>
      <h1>📚 수행평가 일정</h1>
      <p>다가오는 수행평가를 한눈에 확인하세요.</p>
    </div>

    <button id="adminButton" class="admin-button">
      관리자
    </button>
  </header>

  <main>

    <section class="main-section">

      <div class="section-title">
        <h2>다가오는 수행평가</h2>
        <span id="todayText"></span>
      </div>

      <div id="upcomingList" class="performance-list"></div>

    </section>


    <section class="main-section">

      <div class="section-title">
        <h2>전체 일정</h2>

        <select id="subjectFilter">
          <option value="all">전체 과목</option>
        </select>
      </div>

      <div id="allList" class="performance-list"></div>

    </section>

  </main>


  <div id="loginModal" class="modal hidden">

    <div class="modal-box">

      <button id="closeLogin" class="close-button">×</button>

      <h2>관리자 로그인</h2>

      <p>반장 · 부반장 · 총무 전용</p>

      <input
        id="passwordInput"
        type="password"
        placeholder="비밀번호"
        autocomplete="off"
      >

      <button id="loginButton" class="primary-button">
        로그인
      </button>

      <p id="loginError" class="error-text"></p>

    </div>

  </div>


  <div id="adminPanel" class="admin-panel hidden">

    <div class="admin-header">

      <div>
        <h2>관리자 페이지</h2>
        <p>수행평가 일정을 관리합니다.</p>
      </div>

      <button id="logoutButton" class="secondary-button">
        로그아웃
      </button>

    </div>


    <div class="subject-manager">

      <label for="adminSubject">
        관리할 과목
      </label>

      <select id="adminSubject"></select>

    </div>


    <div class="form-box">

      <h3>수행평가 추가</h3>

      <label>
        수행평가명
        <input
          id="performanceTitle"
          type="text"
          placeholder="예: 수학 탐구 보고서"
        >
      </label>

      <label>
        날짜
        <input
          id="performanceDate"
          type="date"
        >
      </label>

      <label>
        준비사항
        <input
          id="performanceMaterials"
          type="text"
          placeholder="예: 보고서 출력물"
        >
      </label>

      <label>
        상세 내용
        <textarea
          id="performanceDescription"
          placeholder="수행평가 관련 내용을 입력하세요."
        ></textarea>
      </label>

      <button id="addPerformance" class="primary-button">
        + 수행평가 추가
      </button>

    </div>


    <div class="form-box">

      <h3>
        <span id="selectedSubjectName"></span>
        일정
      </h3>

      <div id="adminList"></div>

    </div>

  </div>


  <footer>
    <p>우리 반 수행평가 일정 관리</p>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
